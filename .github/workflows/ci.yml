name: CI

on:
  push:
    branches: [main, feat_macos, feat_m39]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build -j 3

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Dump smoke
        run: |
          ./cpp/build/syspeek --dump > "${RUNNER_TEMP}/syspeek-dump.json"
          python3 - "${RUNNER_TEMP}/syspeek-dump.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          h = d["host"]
          assert d["processCount"] > 0, d
          assert len(d["processes"]) > 0, d
          assert h["cores"] > 0, h
          assert h["memTotalKb"] > 0, h
          print("dump ok:", d["platform"], h["cores"], "cores",
                int(h["memTotalKb"] // 1024), "MiB", d["processCount"], "procs")
          PY
        env:
          QT_QPA_PLATFORM: offscreen
